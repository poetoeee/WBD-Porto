<body>

            </nav>
            <button id="enter-terminal" class="enter-terminal-btn">&gt; ENTER TERMINAL _</button>
        </div>
    </div>

    <!-- ── TERMINAL ────────────────────────────────────────────── -->
    <div id="terminal-window" class="terminal-window" hidden>
        <header class="terminal-header">
            <div class="header-buttons">
                <span class="button close"    title="Close"></span>
                <span class="button minimize" title="Minimize"></span>
                <span class="button maximize" title="Maximize"></span>
            </div>
            <p class="header-title">Muhammad Edo Raduputu Aprima   </p>
        </header>

        <main id="terminal-body" class="terminal-body">
            <div id="output"></div>
            <div class="input-line" id="input-line">
                <span class="prompt" id="prompt-display">edo@portfolio:~$</span>
                <input
                    type="text"
                    id="terminal-input"
                    autocomplete="off"
                    spellcheck="false"
                    autocorrect="off"
                    autocapitalize="off"
                    aria-label="Terminal input"
                >
            </div>
        </main>

        <nav class="mobile-commands" id="mobile-commands" aria-label="Quick commands">
            <button onclick="runMobileCmd('ls')">ls</button>
            <button onclick="runMobileCmd('cd ~')">~ home</button>
            <button onclick="runMobileCmd('cd projects')">projects</button>
            <button onclick="runMobileCmd('whoami')">whoami</button>
            <button onclick="runMobileCmd('tree')">tree</button>
            <button onclick="runMobileCmd('help')">help</button>
            <button onclick="runMobileCmd('clear')">clear</button>
        </nav>
    </div>

    <!-- Hover Card Preview -->
    <div id="hover-card" class="hover-card" hidden>
        <div class="hc-img-wrap" id="hc-img-wrap">
            <img id="hc-img" src="" alt="">
        </div>
        <p class="hc-title" id="hc-title"></p>
        <p class="hc-desc"  id="hc-desc"></p>
        <div class="hc-badges" id="hc-badges"></div>
    </div>

    <!-- Project Viewer Modal -->
    <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" hidden>
        <div id="modal-window" class="modal-window">
            <div class="modal-titlebar" id="modal-titlebar">
                <div class="modal-ctrl">
                    <span class="modal-btn modal-close" id="modal-close-btn" title="Close (Esc)"></span>
                    <span class="modal-btn modal-min"   title="Minimize"></span>
                    <span class="modal-btn modal-max"   title="Maximize"></span>
                </div>
                <span class="modal-title" id="modal-title">project-viewer</span>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
